# Private tmux server of the account footer (sockets teamclaude-hud, teamcodex-hud, teamagy-hud, teamgrok-hud, teamcursor-hud).
# Esc reaches the CLI at once (it interrupts a running turn).
set -s escape-time 0
# The CLI's scrollback lives in tmux.
set -g history-limit 50000
# Shift+Enter and other modified keys reach the CLI.
set -s extended-keys on
set -as terminal-features '*:extkeys'
