name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 24 / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh locales tmux
          sudo locale-gen ko_KR.UTF-8
      - name: Check required system tools
        run: |
          node --version
          python3 --version
          command -v lsof
          test -x /bin/zsh
          /bin/zsh --version
          locale -a | grep -Eiq '^ko_KR\.utf-?8$'
      - name: Run all tests
        run: npm test -- --test-concurrency=1
      - name: Footer and status line tests (Python)
        run: npm run test:hud

  windows:
    name: Node.js 24 / Windows (app mode)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The Windows app path: installer (fake HOME/LOCALAPPDATA), run spec -> real server,
      # accounts/sync and --json changes applied live without lsof/SIGHUP; codex.exe lookup;
      # config writes (rename retry); loopback callback on 127.0.0.1 and ::1.
      - name: App mode tests
        run: node --test test/app-installer-win.test.js test/codex.test.js test/config.test.js test/oauth-callback.test.js
      # Login cancel without SIGTERM (stdin line / EOF) and the sync route; the rest of the file needs sh.
      - name: App login and sync tests
        run: node --test --test-name-pattern="on stdin cancels|EOF cancels a claude|pasted before the race|accounts/sync. key required" test/app-json.test.js
